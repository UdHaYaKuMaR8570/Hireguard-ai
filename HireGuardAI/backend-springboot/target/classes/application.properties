# ===================================================================
# HireGuard AI — Spring Boot Application Configuration Template
# ===================================================================

server.port=8080
spring.application.name=hireguard-backend

# -------------------------------------------------------------------
# MongoDB Configuration (Application Data Document Store)
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hireguard}
spring.data.mongodb.database=${MONGODB_DB:hireguard}

# -------------------------------------------------------------------
# Neo4j Configuration (Relationship & Graph Intelligence Store)
# -------------------------------------------------------------------
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:hireguard123}

# -------------------------------------------------------------------
# JWT Authentication Configuration
# Note: In production, inject a secure 256-bit key via environment variables
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:hireguard_ai_research_project_super_secret_jwt_key_2026_ieee_final_year_secure_hex}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Logging & Debugging
# -------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.hireguard=DEBUG

# -------------------------------------------------------------------
# Python AI Microservice Configuration
# -------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://ai-service:8001}

# -------------------------------------------------------------------
# External WHOIS API Configuration
# -------------------------------------------------------------------
whois.api.url=${WHOIS_API_URL:}
whois.api.key=${WHOIS_API_KEY:}

