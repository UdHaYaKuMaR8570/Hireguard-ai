version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: hireguard_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: hireguard_neo4j
    ports:
      - "7474:7474"   # HTTP interface
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/hireguard123
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service-python
      dockerfile: Dockerfile
    container_name: hireguard_ai_service
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - MODEL_NAME=distilbert-base-uncased
      - LOW_RISK_THRESHOLD=30
      - HIGH_RISK_THRESHOLD=70
    restart: unless-stopped

  backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: hireguard_backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/hireguard
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=hireguard123
      - AI_SERVICE_URL=http://ai-service:8001
      - WHOIS_API_URL=https://api.api-ninjas.com/v1/whois?domain={domain}
      - WHOIS_API_KEY=eV3YoCU4DLTm1qbzZwH3dVdH9oSah68tUt2t53ll
      - MCA_API_URL=https://mca-india-company-master-director-din-intelligence-pro.p.rapidapi.com/company
      - MCA_API_KEY=bb72734da0mshdf5723924df6a33p1e4711jsnf8039ff8e76c
      - MCA_API_HOST=mca-india-company-master-director-din-intelligence-pro.p.rapidapi.com
    depends_on:
      - mongodb
      - neo4j
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: hireguard_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  neo4j_data:
